name: select-xcode
description: >
  Select the newest released (non-beta) Xcode at or above the App Store SDK floor, prove the
  selected Xcode really reports that version and ships that iOS SDK, and fail if the runner image
  has none. The floor is ios/tools/min-sdk-major, shared with testflight_archive.sh,
  appstore_preflight.py and check_bundle_sdk.py (ITMS-90725: from April 2027 App Store Connect
  requires the iOS 27 SDK). CI must build and test with the SDK that ships, not the image default.
  Exports SGGS_XCODE_MAJOR, SGGS_SDK_MAJOR and SGGS_SIM_SDK for later steps (e.g. picking a matching simulator).
inputs:
  min-major:
    description: Lowest acceptable Xcode / iOS SDK major. Empty = read ios/tools/min-sdk-major.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MIN_MAJOR: ${{ inputs.min-major }}
        APPS_DIR: /Applications
      run: bash "$GITHUB_ACTION_PATH/select.sh"
