name: ci
# Gates that need no Mac: the pinned inputs are exactly what their owners publish, the version
# invariants hold, and the iOS source/listing/archive gates pass. Runs on every PR (required).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Vendored files == vendor.lock.json == their sources at the pinned commits
        env:
          GH_TOKEN: ${{ secrets.SGGS_READ_TOKEN || github.token }}
        run: python3 scripts/vendor_sync.py check --remote
      - name: sggs-data publishes the pinned database
        env:
          GH_TOKEN: ${{ secrets.SGGS_READ_TOKEN || github.token }}
        run: python3 scripts/data/fetch_dataset.py --check-pin
      - name: Version invariants (MARKETING_VERSION == vendored platform release)
        run: python3 scripts/release/check_versions.py
      - name: iOS gates (source, listing, archive tooling)
        run: python3 -m unittest discover -s ios/tests -v
      # Device-run evidence (docs/ios/device-evidence.md): every recorded run is well-formed, its
      # verdict recomputes, nothing identifying is published, and the derived files are current.
      - name: Device-run records (ios/device-runs)
        run: |
          python3 ios/tools/device_run.py check
          python3 ios/tools/device_run.py rebuild --check
      # Each run's raw bundles exist, at the recorded sizes, in the private evidence repository.
      # Until that repository exists (or when the token cannot read it) this is a notice, not a failure;
      # once it can be read, a missing release or asset fails.
      - name: Device-run bundles exist in the evidence repository (name + size)
        env:
          SGGS_READ_TOKEN: ${{ secrets.SGGS_READ_TOKEN }}
        run: |
          set -o pipefail   # the default `bash -e` has no pipefail: `| tee` would hide the exit code
          shopt -s nullglob
          runs=(ios/device-runs/*/*/summary.json)
          if [ ${#runs[@]} -eq 0 ]; then echo "no device runs recorded yet"; exit 0; fi
          python3 ios/tools/device_run.py verify-assets --sizes --skip-if-unavailable "${runs[@]}" | tee "$RUNNER_TEMP/assets.txt"
          if grep -q '^NOTICE:' "$RUNNER_TEMP/assets.txt"; then
            echo "::notice title=device-run assets::$(grep '^NOTICE:' "$RUNNER_TEMP/assets.txt" | head -1)"
          fi
