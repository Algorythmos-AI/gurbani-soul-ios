name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Monday full history scan
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
      - name: gitleaks (open-source binary)
        run: |
          V=8.21.2
          # sha256 of gitleaks_8.21.2_linux_x64.tar.gz, from the release's gitleaks_8.21.2_checksums.txt.
          # -f fails on an HTTP error (a 504 HTML page was once piped into tar), retries ride out
          # CDN hiccups, and the pinned hash refuses a corrupt or substituted binary.
          SHA=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SHA}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact --no-banner --config .gitleaks.toml --exit-code 1
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: bandit (python)
        run: |
          pip install bandit
          bandit -r ios/tools scripts pipeline -ll || true
      - name: actionlint (workflow files)
        uses: raven-actions/actionlint@v2
