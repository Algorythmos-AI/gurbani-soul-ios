name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Monday full history scan
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
      - name: gitleaks (open-source binary)
        run: |
          V=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --no-banner --config .gitleaks.toml --exit-code 1
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: bandit (python)
        run: |
          pip install bandit
          bandit -r ios/tools scripts pipeline -ll || true
      - name: actionlint (workflow files)
        uses: raven-actions/actionlint@v2
