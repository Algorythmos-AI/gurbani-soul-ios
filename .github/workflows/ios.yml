name: iOS fidelity gate

# Two independent gates on every push / PR:
#   parity — the Swift search/verify/reader/analytics core stays byte-for-byte with the
#            Python backend, on the VENDORED SQLite 3.51.0 (the engine the app ships),
#            for BOTH DB profiles (personal incl. English/timing; public Gurmukhi-only).
#   app    — the SGGS app target builds and its unit + UI tests pass on a simulator.
# Keeping them separate makes a kit-parity failure distinguishable from an app failure.
# Inputs owned elsewhere arrive pinned: the database from sggs-data (dataset.lock.json) and the
# golden contract + DB builder as vendored files (vendor.lock.json, checked by ci.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every run step is `bash -eo pipefail`: the test steps pipe xcodebuild through `tail`, and without
# pipefail the pipe's exit status was tail's (0) — failing tests left the required `app` check
# green on every main run from at least 2026-09-24 to 2026-10-16 (1–2 unit + 4 UI failures hidden).
# A rebase or fix-up pushed to a PR cancels that PR's still-running jobs (the old commit no longer
# matters), so the shared macOS queue carries only one run per PR. Pushes to main never cancel.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  parity:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fetch-dataset
        with: { token: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
      - uses: ./.github/actions/select-xcode   # build + test with the SDK that ships (was the image default, Xcode 16.4)
      - name: Build the bundled (personal-profile) iOS DB from the source (deterministic)
        run: python3 pipeline/build_ios_db.py --profile personal
      - name: Build the public (Gurmukhi-only) profile for the degradation-parity gate
        run: python3 pipeline/build_ios_db.py --profile public
      - name: Verify the iOS DB matches its certified manifest (db_sha256)
        run: |
          EXPECTED=$(python3 -c "import json;print(json.load(open('ios/Resources/sggs-ios.manifest.json'))['db_sha256'])")
          ACTUAL=$(shasum -a 256 ios/Resources/sggs-ios.sqlite | cut -d' ' -f1)
          echo "expected=$EXPECTED actual=$ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
      - name: Kit parity tests on the vendored SQLite 3.51.0 (the fidelity gate)
        run: swift test --package-path ios/Packages/GurbaniSearchKit
      - name: Release-readiness gate (NOTICE.md hard-gate)
        run: |
          # the PUBLIC artifact must always pass
          pipeline/check_release_license.sh
          # the PERSONAL (English-bundled) artifact must be BLOCKED without a licence
          # attestation (negative test, independent of the committed attestation flag) …
          if SGGS_LICENSE_ATTESTATION=/dev/null pipeline/check_release_license.sh ios/Resources/sggs-ios.manifest.json; then
            echo "ERROR: the personal manifest passed the gate with no licence attestation"; exit 1
          fi
          echo "personal profile correctly blocked without an attestation"
          # … and must PASS once the licence is attested (positive test, temp file only)
          printf 'LICENSED: true\n' > "$RUNNER_TEMP/attest.md"
          SGGS_LICENSE_ATTESTATION="$RUNNER_TEMP/attest.md" pipeline/check_release_license.sh ios/Resources/sggs-ios.manifest.json
          echo "personal profile correctly released by an attestation"

  # The app target: unit tests (integration + launch-cache) and XCUITests on a simulator.
  # The xcodeproj is generated (not committed); the DB is rebuilt deterministically per job.
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fetch-dataset
        with: { token: "${{ secrets.SGGS_READ_TOKEN || github.token }}" }
      - uses: ./.github/actions/select-xcode   # build + test with the SDK that ships (was the image default, Xcode 16.4)
      - name: Build the bundled (personal-profile) iOS DB
        run: python3 pipeline/build_ios_db.py --profile personal
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate SGGS.xcodeproj
        run: xcodegen generate --spec ios/App/project.yml --project ios/App
      - name: Committed Info.plists match the spec (version keys can't silently drift)
        run: |
          git diff --exit-code -- ios/App/Tests/UI/Info.plist ios/App/Widgets/Info.plist \
            || { echo "::error::a committed Info.plist differs from what XcodeGen generates — commit the regenerated file"; exit 1; }
      - name: Resolve an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          devs=[dev for k in sorted(d, reverse=True) for dev in d[k]
                if dev.get('isAvailable') and dev['name'].startswith('iPhone')]
          print(devs[0]['udid'])")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
      - name: Build for testing
        id: build
        run: |
          xcodebuild build-for-testing -project ios/App/SGGS.xcodeproj -scheme SGGS \
            -destination "id=$SIM_UDID" CODE_SIGNING_ALLOWED=NO | tail -40
      - name: Unit tests (SGGSTests)
        run: |
          xcodebuild test-without-building -project ios/App/SGGS.xcodeproj -scheme SGGS \
            -destination "id=$SIM_UDID" -only-testing:SGGSTests \
            -test-timeouts-enabled YES -resultBundlePath "$RUNNER_TEMP/unit.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tail -60
      # Runs even when the unit tests failed, so one run reports every failure (the job still fails).
      - name: UI tests (SGGSUITests)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          xcodebuild test-without-building -project ios/App/SGGS.xcodeproj -scheme SGGS \
            -destination "id=$SIM_UDID" -only-testing:SGGSUITests \
            -test-timeouts-enabled YES -resultBundlePath "$RUNNER_TEMP/uitests.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tail -80
      # Two Nitnem UI tests fail intermittently on the simulator (timing, not code; each has passed on the
      # identical commit a run earlier). When they are the ONLY failures, run just those tests once more
      # and let the retry's bundle stand for the gate; any other failure leaves the first bundle untouched.
      - name: Retry the known-flaky UI tests once (only when nothing else failed)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          f="$RUNNER_TEMP/uitests.xcresult"
          [ -d "$f" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$f" --compact > "$RUNNER_TEMP/uitests-first.json" || exit 0
          only=$(python3 - "$RUNNER_TEMP/uitests-first.json" <<'PY'
          import json, sys
          flaky = {"testNitnemOpensJapjiAndCompletes", "testJourneyOpens"}
          s = json.load(open(sys.argv[1]))
          names = set()
          for t in s.get('testFailures', []):
              ident = t.get('testIdentifierString') or t.get('testName') or ''
              names.add(ident.split('/')[-1].rstrip('()'))
          print(' '.join(sorted(names)) if names and names <= flaky else '')
          PY
          )
          [ -n "$only" ] || { echo "no flaky-only failure set; nothing to retry"; exit 0; }
          echo "::warning::retrying known-flaky UI tests once: $only"
          mv "$f" "$RUNNER_TEMP/uitests-first.xcresult"
          read -ra names <<<"$only"; args=()
          for t in "${names[@]}"; do args+=("-only-testing:SGGSUITests/SGGSUITests/$t"); done
          xcodebuild test-without-building -project ios/App/SGGS.xcodeproj -scheme SGGS \
            -destination "id=$SIM_UDID" "${args[@]}" \
            -test-timeouts-enabled YES -resultBundlePath "$f" \
            CODE_SIGNING_ALLOWED=NO | tail -40 || true
      # The log above keeps only its last lines; name every failing test from the result bundles.
      - name: Failing tests (from the result bundles)
        # Names every failing test, and is a second, independent gate: the job also fails here if a
        # test step that ran left no readable bundle, or if a bundle reports a failure.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bad=0
          for b in unit uitests; do
            f="$RUNNER_TEMP/$b.xcresult"
            if [ ! -d "$f" ]; then echo "::error title=$b::no result bundle — the test step did not finish"; bad=1; continue; fi
            if ! xcrun xcresulttool get test-results summary --path "$f" --compact > "$RUNNER_TEMP/$b.json"; then
              echo "::error title=$b::the result bundle could not be read (interrupted or malformed)"; bad=1; continue
            fi
            python3 - "$RUNNER_TEMP/$b.json" "$b" <<'PY' || bad=1
          import json, sys
          s = json.load(open(sys.argv[1])); name = sys.argv[2]
          failed = s.get('failedTests') or 0
          print(f"{name}: {s.get('result')} — passed {s.get('passedTests')}, failed {failed}, skipped {s.get('skippedTests')}")
          for f in s.get('testFailures', []):
              line = f"{f.get('testIdentifierString') or f.get('testName')}: {(f.get('failureText') or '').splitlines()[0][:300]}"
              print("FAILED " + line)
              print(f"::error title={name} test failed::{line}")
          sys.exit(1 if failed or s.get('result') != 'Passed' or not s.get('passedTests') else 0)
          PY
          done
          exit $bad
      # Upload the result bundles so a failure is diagnosable (screenshots, per-test logs).
      - name: Upload test result bundles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/uitests.xcresult
            ${{ runner.temp }}/uitests-first.xcresult
          if-no-files-found: ignore
          retention-days: 7
