name: SGGS
options:
  bundleIdPrefix: org.sggs
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.6.3"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  GurbaniSearchKit:
    path: ../Packages/GurbaniSearchKit
targets:
  SGGS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        excludes: ["Info.plist"]
      - path: ../Resources/sggs-ios.sqlite
        buildPhase: resources
      - path: ../Resources/sggs-ios.manifest.json
        buildPhase: resources
      - path: ../../frontend/public/contributors.json
        buildPhase: resources
    dependencies:
      - package: GurbaniSearchKit
        product: GurbaniSearchKit
      - package: GurbaniSearchKit
        product: GurbaniDB
      - package: GurbaniSearchKit
        product: GurbaniPahar
      - target: SGGSWidgets
        embed: true
      - target: SGGSNotificationService
        embed: true
    entitlements:
      path: SGGS.entitlements
      properties:
        com.apple.security.application-groups: [group.org.sggs]
        # Remote push for the Hukamnama from Sri Harmandir Sahib. Expanded per configuration
        # (Debug = development/sandbox tokens; Release = production — TestFlight AND App Store
        # builds get production tokens). The same setting is reported to the server as `env`.
        aps-environment: $(HUKAMNAMA_APS_ENV)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # The Hukamnama service (sggs-platform services/hukamnama). Release builds point at
        # production; ios/tools/testflight_archive.sh overrides it to staging for the
        # testflight channel. Read from Info.plist (HukamnamaAPIBase) — never typed in code.
        HUKAMNAMA_API_BASE: https://api-staging.gurbanisoul.com
        HUKAMNAMA_APS_ENV: development
        # The feature ships dark until G3 (copy), G4 (privacy) and H-src (SGPC) are signed:
        # Debug builds (tests, CI, development) show it; Release builds hide every surface.
        HUKAMNAMA_ENABLED: "YES"
      configs:
        # Release = the archive/TestFlight configuration. DEVELOPMENT_TEAM stays "" here BY DESIGN:
        # ios/tools/testflight_archive.sh injects the Team ID on the xcodebuild command line, so it
        # is never committed. Automatic signing then creates the App ID + App Group
        # (group.org.sggs) profiles. Debug/CI stay unsigned
        # (CI passes CODE_SIGNING_ALLOWED=NO on the command line, which wins).
        Release:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: ""
          HUKAMNAMA_API_BASE: https://api.gurbanisoul.com
          HUKAMNAMA_APS_ENV: production
          HUKAMNAMA_ENABLED: "NO"
  # WidgetKit extension: links ONLY the dependency-free GurbaniPahar product + the shared
  # snapshot store — never CSQLite or the 100 MB corpus DB. Entitlements are inert on the
  # simulator (CI stays green with CODE_SIGNING_ALLOWED NO); device installs need signing.
  SGGSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      # The Hukam widget typesets Gurmukhi — the extension must bundle+register the scripture
      # font itself (extensions don't inherit the app's resources; without this it silently
      # falls back to SF). PrivacyInfo ships in every distributable target.
      - path: Resources/SantLipi.ttf
        buildPhase: resources
      - path: Resources/SourceSerif4.ttf
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: GurbaniSearchKit
        product: GurbaniPahar
    entitlements:
      path: Widgets/SGGSWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.org.sggs]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Gurbani Soul
        # Must track the app's MARKETING_VERSION — App Store validation rejects an extension
        # whose CFBundleShortVersionString differs from the containing app.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [SantLipi.ttf, SourceSerif4.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app.widgets
      configs:
        Release:                      # must match the app target (same team, same App Group)
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: ""
  # Notification Service Extension for the Hukamnama push: a PASS-THROUGH data writer. It never
  # edits the notification; it merges the payload's fields into hukamnama-snapshot.json (App
  # Group) and reloads the "Hukamnama" widget kind. Links no package (no CSQLite, no corpus DB):
  # only the one shared store file. PrivacyInfo ships in every distributable target.
  SGGSNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared/HukamnamaShared.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: NotificationService/SGGSNotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.org.sggs]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Gurbani Soul
        # Must track the app's MARKETING_VERSION (App Store validation, as for the widgets).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app.notifications
      configs:
        Release:                      # must match the app target (same team, same App Group)
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: ""
  SGGSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      # Hukamnama fixtures (generated from the corpus by ios/tools/hukamnama_fixture.py; never
      # hand-typed). The .apns file is also the `xcrun simctl push` fixture.
      - path: Tests/Fixtures
        buildPhase: resources
      # The platform's brand tokens (vendored, vendor.lock.json) — BrandTokensParityTests pins
      # DesignTokens.swift to them. Test bundle only; the app never ships this file.
      - path: ../../docs/brand/tokens.json
        buildPhase: resources
    dependencies:
      - target: SGGS
      - package: GurbaniSearchKit
        product: GurbaniDB
      - package: GurbaniSearchKit
        product: GurbaniSearchKit
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app.tests }
  SGGSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies: [target: SGGS]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: org.sggs.app.uitests }
schemes:
  SGGS:
    build:
      targets: { SGGS: all }
    test:
      targets: [SGGSTests, SGGSUITests]
      gatherCoverageData: false
